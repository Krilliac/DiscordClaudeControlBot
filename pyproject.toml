[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-claude-control"
version = "0.1.0"
description = "Discord-controlled personal PC agent using the Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1",
    "mss>=9.0",
    "psutil>=5.9",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
discord-claude-control = "discord_claude_control.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_claude_control"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["psutil.*", "mss.*", "pyautogui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
